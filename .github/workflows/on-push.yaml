---
name: On Push

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host:
          - maple
          - tumble
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3.15.2

      # NOTE: This is a workaround for DisplayLink EULA
      - run: ./hosts/linux/programs/displaylink/prefetch-displaylink.sh

      - run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        host:
          - tumble
    steps:
      - uses: actions/checkout@v6
      
      - uses: DeterminateSystems/determinate-nix-action@v3.15.2
      
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_CLIENT_AUD }}
          tags: tag:ci
          ping: ${{ matrix.host }}
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TUMBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts
      
      - name: Deploy to remote host
        run: |
          nixos-rebuild switch --flake .#${{ matrix.host }} --target-host zspar@${{ matrix.host }} --use-remote-sudo
