---
name: On Push

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - maple
          - tumble
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3.15.2

      # NOTE: This is a workaround for DisplayLink EULA
      - run: ./hosts/linux/programs/displaylink/prefetch-displaylink.sh

      - run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
